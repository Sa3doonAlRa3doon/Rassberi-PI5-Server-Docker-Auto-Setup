# Docker state and databases live on the verified NVMe root filesystem.
# Bulk-drive loss is handled per application by pi-storage-watch.service.
[Unit]
RequiresMountsFor=/srv/docker
After=local-fs.target

[Service]
ExecStartPre=/usr/bin/python3 /srv/docker/scripts/storage_guard.py --only root --config /srv/docker/configs/storage.json --manifest /srv/docker/manifest.json
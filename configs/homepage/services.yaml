[
  {
    "Verified storage": [
      {
        "NVMe SSD": {
          "description": "OS, Docker and databases at /",
          "widget": {
            "type": "customapi",
            "url": "http://storage-metrics:9079/v1/storage/root",
            "refreshInterval": 30000,
            "display": "list",
            "mappings": [
              {
                "field": "display.status",
                "label": "Verified status",
                "format": "text"
              },
              {
                "field": "display.total",
                "label": "Total",
                "format": "text"
              },
              {
                "field": "display.used",
                "label": "Used",
                "format": "text"
              },
              {
                "field": "display.free",
                "label": "Free",
                "format": "text"
              },
              {
                "field": "display.percent",
                "label": "Used %",
                "format": "text"
              }
            ]
          }
        }
      },
      {
        "1 TB HDD": {

global
  log stdout format raw local0
  maxconn 128
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
frontend read_only_docker
  bind /proxy/docker.sock mode 0600
  acl read_method method GET HEAD
  acl allowed_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|containers/json|containers/[^/]+/(json|stats|logs))$
  http-request deny deny_status 403 unless read_method allowed_path
  default_backend docker
backend docker
  server engine /var/run/docker.sock

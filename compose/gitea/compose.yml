{
  "name": "pi-gitea",
  "services": {
    "db": {
      "image": "postgres:17.11-bookworm",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_DB": "gitea",
        "POSTGRES_USER": "gitea",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/databases/gitea",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "timezone=Asia/Dubai",
        "-c",
        "log_timezone=Asia/Dubai"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1\" >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      },
      "stop_grace_period": "60s"
    },
    "app": {
      "image": "gitea/gitea:1.27.3",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "384m",
      "cpus": 0.75,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "USER_UID": "${PUID:-1000}",
        "USER_GID": "${PGID:-1000}",
        "GITEA__database__DB_TYPE": "postgres",
        "GITEA__database__HOST": "db:5432",
        "GITEA__database__NAME": "gitea",
        "GITEA__database__USER": "gitea",
        "GITEA__database__PASSWD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "GITEA__server__DOMAIN": "${SERVER_IP:?Set SERVER_IP}",
        "GITEA__server__ROOT_URL": "http://${SERVER_IP:?Set SERVER_IP}:3001/",
        "GITEA__server__SSH_DOMAIN": "${SERVER_IP:?Set SERVER_IP}",
        "GITEA__server__SSH_PORT": "2222",
        "GITEA__service__DISABLE_REGISTRATION": "true",
        "GITEA__security__SECRET_KEY": "${SECRET_KEY:?SECRET_KEY missing}",
        "GITEA__security__INTERNAL_TOKEN": "${INTERNAL_TOKEN:?INTERNAL_TOKEN missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/gitea",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "ports": [
        {
          "target": 3000,
          "published": "3001",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        },
        {
          "target": 22,
          "published": "2222",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/healthz"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "120s"
      }
    }
  },
  "networks": {
    "frontend": {},
    "backend": {
      "internal": true
    }
  }
}

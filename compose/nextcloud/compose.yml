{
  "name": "pi-nextcloud",
  "services": {
    "db": {
      "image": "postgres:17.11-bookworm",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "384m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_DB": "nextcloud",
        "POSTGRES_USER": "nextcloud",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/databases/nextcloud",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "timezone=Asia/Dubai",
        "-c",
        "log_timezone=Asia/Dubai"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1\" >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      },
      "stop_grace_period": "60s"
    },
    "redis": {
      "image": "redis:8.6.7-alpine",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "96m",
      "cpus": 0.3,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "REDIS_PASSWORD": "${REDIS_PASSWORD:?REDIS_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/nextcloud/redis",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "/bin/sh",
        "-c",
        "exec redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      }
    },
    "app": {
      "image": "nextcloud:34.0.4-apache",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "768m",
      "cpus": 1.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_HOST": "db",
        "POSTGRES_DB": "nextcloud",
        "POSTGRES_USER": "nextcloud",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "REDIS_HOST": "redis",
        "REDIS_HOST_PASSWORD": "${REDIS_PASSWORD:?REDIS_PASSWORD missing}",
        "NEXTCLOUD_ADMIN_USER": "${ADMIN_USER:-saeed}",
        "NEXTCLOUD_ADMIN_PASSWORD": "${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}",
        "NEXTCLOUD_TRUSTED_DOMAINS": "${SERVER_IP:?Set SERVER_IP} ${BIND_IP:?Set BIND_IP}",
        "NEXTCLOUD_DATA_DIR": "/var/www/html/data",
        "PHP_MEMORY_LIMIT": "256M",
        "PHP_UPLOAD_LIMIT": "2G",
        "OVERWRITECLIURL": "http://${SERVER_IP:?Set SERVER_IP}:8080",
        "APACHE_DISABLE_REWRITE_IP": "1"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/nextcloud/html",
          "target": "/var/www/html",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/mnt/hdd/Nextcloud",
          "target": "/var/www/html/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "ports": [
        {
          "target": 80,
          "published": "8080",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "$$s=json_decode(@file_get_contents(\"http://127.0.0.1/status.php\"),true); exit(!is_array($$s)||!($$s[\"installed\"]??false)||($$s[\"maintenance\"]??true)||($$s[\"needsDbUpgrade\"]??true));"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "600s"
      }
    },
    "cron": {
      "image": "nextcloud:34.0.4-apache",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_HOST": "db",
        "POSTGRES_DB": "nextcloud",
        "POSTGRES_USER": "nextcloud",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "REDIS_HOST": "redis",
        "REDIS_HOST_PASSWORD": "${REDIS_PASSWORD:?REDIS_PASSWORD missing}",
        "NEXTCLOUD_ADMIN_USER": "${ADMIN_USER:-saeed}",
        "NEXTCLOUD_ADMIN_PASSWORD": "${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}",
        "NEXTCLOUD_TRUSTED_DOMAINS": "${SERVER_IP:?Set SERVER_IP} ${BIND_IP:?Set BIND_IP}",
        "NEXTCLOUD_DATA_DIR": "/var/www/html/data",
        "PHP_MEMORY_LIMIT": "256M",
        "PHP_UPLOAD_LIMIT": "2G",
        "OVERWRITECLIURL": "http://${SERVER_IP:?Set SERVER_IP}:8080",
        "APACHE_DISABLE_REWRITE_IP": "1"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/nextcloud/html",
          "target": "/var/www/html",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/mnt/hdd/Nextcloud",
          "target": "/var/www/html/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "entrypoint": "/cron.sh",
      "depends_on": {
        "app": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "networks": {
    "frontend": {},
    "backend": {
      "internal": true
    }
  }
}

{
  "name": "pi-portainer",
  "services": {
    "portainer": {
      "image": "portainer/portainer-ce@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "160m",
      "cpus": 0.35,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}"
      },
      "ports": [
        {
          "target": 9443,
          "published": "9443",
          "host_ip": "${BIND_IP:?Set a private Pi address in .env}",
          "protocol": "tcp"
        }
      ],
      "stop_grace_period": "45s",
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/portainer",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/configs/portainer",
          "target": "/run/initial",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/var/run/docker.sock",
          "target": "/var/run/docker.sock",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "command": [
        "--admin-password-file",
        "/run/initial/admin-password"
      ]
    }
  }
}

{
  "name": "pi-autoheal",
  "services": {
    "autoheal-proxy": {
      "image": "ghcr.io/journeydocker/docker-autoheal@sha256:d35179b414d05a1d787700c2ae37bfff9d0a61a91eed6233a89b15f982a42c65",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "64m",
      "cpus": 0.2,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "stop_grace_period": "45s",
      "entrypoint": [
        "python",
        "/config/guard-proxy.py"
      ],
      "command": [],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "/var/run/docker.sock",
          "target": "/var/run/docker.sock",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/configs/autoheal",
          "target": "/config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/proc/1/mountinfo",
          "target": "/host/mountinfo",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "heal"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2375/_ping',timeout=3).read()"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "45s"
      }
    },
    "autoheal": {
      "image": "ghcr.io/journeydocker/docker-autoheal@sha256:d35179b414d05a1d787700c2ae37bfff9d0a61a91eed6233a89b15f982a42c65",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "96m",
      "cpus": 0.25,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "stop_grace_period": "45s",
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "DOCKER_SOCK": "tcp://autoheal-proxy:2375",
        "AUTOHEAL_CONTAINER_LABEL": "pi.autoheal.nvme",
        "AUTOHEAL_ONLY_MONITOR_RUNNING": "true",
        "AUTOHEAL_START_PERIOD": "180",
        "AUTOHEAL_INTERVAL": "30",
        "AUTOHEAL_DEFAULT_STOP_TIMEOUT": "30",
        "AUTOHEAL_RESTART_THRESHOLD": "3",
        "AUTOHEAL_RESTART_WINDOW": "1800"
      },
      "networks": [
        "heal"
      ],
      "depends_on": {
        "autoheal-proxy": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pgrep -f \"python -m autoheal\" >/dev/null"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "45s"
      }
    }
  },
  "networks": {
    "heal": {
      "internal": true
    }
  }
}

{
  "name": "pi-jellyfin",
  "services": {
    "jellyfin": {
      "image": "jellyfin/jellyfin@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "512m",
      "cpus": 1,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}"
      },
      "ports": [
        {
          "target": 8096,
          "published": "8096",
          "host_ip": "${BIND_IP:?Set a private Pi address in .env}",
          "protocol": "tcp"
        }
      ],
      "stop_grace_period": "45s",
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/jellyfin/config",
          "target": "/config",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/jellyfin/cache",
          "target": "/cache",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/mnt/media/Videos",
          "target": "/media/videos",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "user": "${PUID:-1000}:${PGID:-1000}",
      "healthcheck": {
        "interval": "60s",
        "timeout": "15s",
        "retries": 5,
        "start_period": "180s"
      }
    }
  }
}

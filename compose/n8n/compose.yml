{
  "name": "pi-n8n",
  "services": {
    "db": {
      "image": "postgres:17.11-bookworm",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_DB": "n8n",
        "POSTGRES_USER": "n8n",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/databases/n8n",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "timezone=Asia/Dubai",
        "-c",
        "log_timezone=Asia/Dubai"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1\" >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      },
      "stop_grace_period": "60s"
    },
    "app": {
      "image": "n8nio/n8n:2.40.5",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "640m",
      "cpus": 1.0,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "DB_TYPE": "postgresdb",
        "DB_POSTGRESDB_HOST": "db",
        "DB_POSTGRESDB_PORT": "5432",
        "DB_POSTGRESDB_DATABASE": "n8n",
        "DB_POSTGRESDB_USER": "n8n",
        "DB_POSTGRESDB_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "N8N_ENCRYPTION_KEY": "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY missing}",
        "GENERIC_TIMEZONE": "${TZ:-Asia/Dubai}",
        "N8N_HOST": "${SERVER_IP:?Set SERVER_IP}",
        "N8N_PORT": "5678",
        "N8N_PROTOCOL": "http",
        "N8N_EDITOR_BASE_URL": "http://${SERVER_IP:?Set SERVER_IP}:5678/",
        "WEBHOOK_URL": "http://${SERVER_IP:?Set SERVER_IP}:5678/",
        "N8N_SECURE_COOKIE": "false",
        "N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS": "true",
        "N8N_DIAGNOSTICS_ENABLED": "false",
        "N8N_VERSION_NOTIFICATIONS_ENABLED": "false",
        "EXECUTIONS_DATA_PRUNE": "true",
        "EXECUTIONS_DATA_MAX_AGE": "168",
        "EXECUTIONS_DATA_PRUNE_MAX_COUNT": "5000",
        "N8N_RUNNERS_MODE": "external",
        "N8N_RUNNERS_AUTH_TOKEN": "${RUNNERS_AUTH_TOKEN:?RUNNERS_AUTH_TOKEN missing}",
        "N8N_RUNNERS_BROKER_LISTEN_ADDRESS": "0.0.0.0",
        "N8N_BLOCK_ENV_ACCESS_IN_NODE": "true",
        "NODE_OPTIONS": "--max-old-space-size=384"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/n8n",
          "target": "/home/node/.n8n",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend",
        "runner"
      ],
      "ports": [
        {
          "target": 5678,
          "published": "5678",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "120s"
      }
    },
    "runners": {
      "image": "n8nio/runners:2.40.5",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "N8N_RUNNERS_AUTH_TOKEN": "${RUNNERS_AUTH_TOKEN:?RUNNERS_AUTH_TOKEN missing}",
        "N8N_RUNNERS_TASK_BROKER_URI": "http://app:5679",
        "N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT": "15",
        "N8N_RUNNERS_MAX_CONCURRENCY": "1"
      },
      "volumes": [],
      "networks": [
        "runner"
      ],
      "depends_on": {
        "app": {
          "condition": "service_healthy"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp:size=67108864,mode=1777"
      ]
    }
  },
  "networks": {
    "frontend": {},
    "backend": {
      "internal": true
    },
    "runner": {
      "internal": true
    }
  }
}

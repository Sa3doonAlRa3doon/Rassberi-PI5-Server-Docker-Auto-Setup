{
  "name": "pi-homepage-tailscale",
  "services": {
    "homepage": {
      "image": "ghcr.io/gethomepage/homepage@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "192m",
      "cpus": 0.25,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "PUID": "${PUID:-1000}",
        "PGID": "${PGID:-1000}",
        "HOMEPAGE_ALLOWED_HOSTS": "${TAILSCALE_HOSTNAME:?Run setup-tailscale-homepage.sh}:3003,${TAILSCALE_HOSTNAME},${TAILSCALE_IPV4:?Run setup-tailscale-homepage.sh}:3003,localhost:3000,127.0.0.1:3000"
      },
      "ports": [
        {
          "target": 3000,
          "published": "3003",
          "host_ip": "${TAILSCALE_IPV4:?Configure the actual Tailscale IPv4 before starting}",
          "protocol": "tcp"
        }
      ],
      "stop_grace_period": "45s",
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/configs/homepage-tailscale",
          "target": "/app/config",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "healthcheck": {
        "interval": "60s",
        "timeout": "15s",
        "retries": 5,
        "start_period": "180s",
        "test": [
          "CMD",
          "node",
          "-e",
          "require('http').get({host:'127.0.0.1',port:3000,path:'/',headers:{host:'localhost:3000'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      }
    }
  }
}

{
  "name": "pi-homebox",
  "services": {
    "homebox": {
      "image": "ghcr.io/sysadminsmedia/homebox@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "192m",
      "cpus": 0.5,
      "stop_grace_period": "60s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "HBOX_AUTH_API_KEY_PEPPER": "${HOMEBOX_API_KEY_PEPPER:?Run installer}",
        "HBOX_OPTIONS_ALLOW_REGISTRATION": "${HOMEBOX_ALLOW_REGISTRATION:-true}",
        "HBOX_OPTIONS_ALLOW_ANALYTICS": "false"
      },
      "ports": [
        {
          "target": 7745,
          "published": "7745",
          "host_ip": "${BIND_IP:?Run installer}",
          "protocol": "tcp"
        }
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/homebox",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "healthcheck": {
        "interval": "60s",
        "timeout": "15s",
        "retries": 4,
        "start_period": "180s"
      },
      "labels": {
        "pi.autoheal.nvme": "true"
      }
    }
  }
}

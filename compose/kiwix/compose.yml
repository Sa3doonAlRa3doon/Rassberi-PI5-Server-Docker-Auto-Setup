{
  "name": "pi-kiwix",
  "services": {
    "kiwix": {
      "image": "ghcr.io/kiwix/kiwix-serve@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}"
      },
      "ports": [
        {
          "target": 8080,
          "published": "8094",
          "host_ip": "${BIND_IP:?Set a private Pi address in .env}",
          "protocol": "tcp"
        }
      ],
      "stop_grace_period": "45s",
      "volumes": [
        {
          "type": "bind",
          "source": "/mnt/hdd/Kiwix",
          "target": "/data",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/configs/kiwix",
          "target": "/config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "user": "${PUID:-1000}:${PGID:-1000}",
      "entrypoint": [
        "/usr/bin/dumb-init",
        "--",
        "/bin/sh",
        "/config/start.sh"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "30s"
      }
    }
  }
}

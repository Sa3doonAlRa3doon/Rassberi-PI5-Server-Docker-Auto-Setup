{
  "name": "pi-moodle",
  "services": {
    "db": {
      "image": "postgres:17.11-bookworm",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_DB": "moodle",
        "POSTGRES_USER": "moodle",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/databases/moodle",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "timezone=Asia/Dubai",
        "-c",
        "log_timezone=Asia/Dubai"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1\" >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      },
      "stop_grace_period": "60s"
    },
    "app": {
      "image": "local/rassberi-moodle:5.2.3",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "768m",
      "cpus": 1.0,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "MOODLE_DB_HOST": "db",
        "MOODLE_DB_NAME": "moodle",
        "MOODLE_DB_USER": "moodle",
        "MOODLE_DB_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "MOODLE_WWWROOT": "http://${SERVER_IP:?Set SERVER_IP}:8082",
        "MOODLE_ADMIN_USER": "${ADMIN_USER:-saeed}",
        "MOODLE_ADMIN_PASSWORD": "${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}",
        "MOODLE_ADMIN_EMAIL": "${ADMIN_EMAIL:-saeed@example.invalid}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/mnt/hdd/Shared/Moodle",
          "target": "/var/moodledata",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/moodle/cache",
          "target": "/var/moodlecache",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "pull_policy": "never",
      "ports": [
        {
          "target": 80,
          "published": "8082",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "php /usr/local/bin/moodle-health.php && curl -fsS --max-time 8 http://127.0.0.1/login/index.php >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "600s"
      }
    },
    "cron": {
      "image": "local/rassberi-moodle:5.2.3",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "256m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "MOODLE_DB_HOST": "db",
        "MOODLE_DB_NAME": "moodle",
        "MOODLE_DB_USER": "moodle",
        "MOODLE_DB_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}",
        "MOODLE_WWWROOT": "http://${SERVER_IP:?Set SERVER_IP}:8082",
        "MOODLE_ADMIN_USER": "${ADMIN_USER:-saeed}",
        "MOODLE_ADMIN_PASSWORD": "${ADMIN_PASSWORD:?ADMIN_PASSWORD missing}",
        "MOODLE_ADMIN_EMAIL": "${ADMIN_EMAIL:-saeed@example.invalid}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/mnt/hdd/Shared/Moodle",
          "target": "/var/moodledata",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/moodle/cache",
          "target": "/var/moodlecache",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "pull_policy": "never",
      "command": [
        "cron"
      ],
      "depends_on": {
        "app": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "php",
          "-r",
          "exit(!is_file(\"/tmp/moodle-cron-ok\") || time()-filemtime(\"/tmp/moodle-cron-ok\")>300);"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "180s"
      }
    }
  },
  "networks": {
    "frontend": {},
    "backend": {
      "internal": true
    }
  }
}

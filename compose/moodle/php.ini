memory_limit = 256M
max_input_vars = 5000
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 120
date.timezone = Asia/Dubai
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0

{
  "name": "pi-beszel",
  "services": {
    "beszel": {
      "image": "henrygd/beszel@sha256:897e807a065adf8e89e30ae0cd79d1f5e38fe84ccaffbc418bde9d3cdca4eacc",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "128m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "stop_grace_period": "45s",
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "APP_URL": "http://${SERVER_IP}:8098",
        "USER_EMAIL": "${BESZEL_USER_EMAIL:-saeed@pi.local}",
        "USER_PASSWORD": "${BESZEL_PASSWORD:?Generated by installer}",
        "CHECK_UPDATES": "false"
      },
      "ports": [
        {
          "target": 8090,
          "published": "8098",
          "host_ip": "${BIND_IP:?Set private Pi address}",
          "protocol": "tcp"
        }
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel",
          "target": "/beszel_data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel-socket",
          "target": "/beszel_socket",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/beszel",
          "health",
          "--url",
          "http://localhost:8090"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "45s"
      }
    },
    "beszel-proxy": {
      "image": "lscr.io/linuxserver/socket-proxy@sha256:ca6c0301a652232d02cb0ff9f1c5d20d9b339f391e1c1dffaae6ef3bfc59d009",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "32m",
      "cpus": 0.2,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "stop_grace_period": "45s",
      "network_mode": "none",
      "entrypoint": [
        "/usr/sbin/haproxy",
        "-f",
        "/config/docker-read.cfg",
        "-db"
      ],
      "command": [],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "SYS_CHROOT"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "/var/run/docker.sock",
          "target": "/var/run/docker.sock",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/configs/beszel",
          "target": "/config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel-docker-socket",
          "target": "/proxy",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ]
    },
    "beszel-agent": {
      "image": "henrygd/beszel-agent@sha256:2a01a5600f780d264682b5f71108d72fa67f50c57e27b52b4184d3d0d01d115c",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "128m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "stop_grace_period": "45s",
      "network_mode": "host",
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "LISTEN": "/beszel_socket/beszel.sock",
        "KEY_FILE": "/config/hub-key.pub",
        "DOCKER_HOST": "unix:///proxy/docker.sock",
        "SMART_DEVICES": "",
        "SMART_INTERVAL": "1h",
        "SKIP_SYSTEMD": "true"
      },
      "cap_add": [
        "SYS_RAWIO",
        "SYS_ADMIN"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel-agent",
          "target": "/var/lib/beszel-agent",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel-socket",
          "target": "/beszel_socket",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/appdata/beszel-docker-socket",
          "target": "/proxy",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/srv/docker/configs/beszel",
          "target": "/config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "depends_on": {
        "beszel-proxy": {
          "condition": "service_started"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "/agent",
          "health"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "45s"
      }
    }
  }
}

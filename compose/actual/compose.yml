{
  "name": "pi-actual",
  "services": {
    "actual": {
      "image": "actualbudget/actual-server@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "128m",
      "cpus": 0.35,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}"
      },
      "ports": [
        {
          "target": 5006,
          "published": "5006",
          "host_ip": "${BIND_IP:?Set a private Pi address in .env}",
          "protocol": "tcp"
        }
      ],
      "stop_grace_period": "45s",
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/actual",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5006/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
        ],
        "interval": "60s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "60s"
      }
    }
  }
}

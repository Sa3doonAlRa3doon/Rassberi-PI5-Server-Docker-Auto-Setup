{
  "name": "pi-vaultwarden",
  "services": {
    "db": {
      "image": "postgres:17.11-bookworm",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "192m",
      "cpus": 0.6,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "POSTGRES_DB": "vaultwarden",
        "POSTGRES_USER": "vaultwarden",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?DB_PASSWORD missing}"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/databases/vaultwarden",
          "target": "/var/lib/postgresql/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "backend"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "timezone=Asia/Dubai",
        "-c",
        "log_timezone=Asia/Dubai"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1\" >/dev/null"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      },
      "stop_grace_period": "60s"
    },
    "app": {
      "image": "vaultwarden/server:1.37.3",
      "platform": "linux/arm64",
      "restart": "on-failure:5",
      "mem_limit": "128m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "environment": {
        "TZ": "${TZ:-Asia/Dubai}",
        "DATABASE_URL": "postgresql://vaultwarden:${DB_PASSWORD:?DB_PASSWORD missing}@db:5432/vaultwarden",
        "DOMAIN": "${VAULTWARDEN_DOMAIN:-http://localhost:8089}",
        "ADMIN_TOKEN": "${ADMIN_TOKEN:?ADMIN_TOKEN missing}",
        "SIGNUPS_ALLOWED": "false",
        "INVITATIONS_ALLOWED": "true",
        "ROCKET_PORT": "80",
        "DATABASE_MAX_CONNS": "5",
        "LOG_LEVEL": "warn"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/srv/docker/appdata/vaultwarden",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "networks": [
        "frontend",
        "backend"
      ],
      "ports": [
        {
          "target": 80,
          "published": "8089",
          "host_ip": "${BIND_IP:?Set BIND_IP to a LAN or Tailscale address}",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "/healthcheck.sh"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "60s"
      }
    }
  },
  "networks": {
    "frontend": {},
    "backend": {
      "internal": true
    }
  }
}
